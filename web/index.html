<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KM Bridge</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0; padding: 1rem;
         display: flex; flex-direction: column; gap: .75rem; min-height: 100vh; }
  textarea { width: 100%; min-height: 8rem; font: 16px ui-monospace, monospace;
             padding: .5rem; box-sizing: border-box; }
  button { font-size: 1.1rem; padding: .9rem; border-radius: .5rem; border: 0; }
  #connect { background: #2d6cdf; color: #fff; }
  #send { background: #1a8a3a; color: #fff; }
  .secondary { background: transparent; color: #2d6cdf; font-size: .9rem;
               padding: .4rem; text-decoration: underline; }
  button:disabled { opacity: .45; }
  #status { font-size: .9rem; opacity: .8; min-height: 1.4em; }
</style>
</head>
<body>
  <button id="connect">Connect to Flipper</button>
  <button id="connect-any" class="secondary">Can't see it? Show all devices</button>
  <button id="disconnect" class="secondary" hidden>Disconnect</button>
  <textarea id="text" placeholder="Paste here" autocomplete="off"
            autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
  <button id="send" disabled>Send</button>
  <div id="status">Not connected</div>

<script type="module">
import { buildCommand, chunk } from './framing.js';

const SERVICE = '8fe5b3d5-2e7f-4a98-2a48-7acc60fe0000';
const TX_CHAR = '19ed82ae-ed21-4c9d-4145-228e62fe0000';
const RX_CHAR = '19ed82ae-ed21-4c9d-4145-228e61fe0000';
const CHUNK = 20; // safe under the default 23-byte ATT MTU

const $ = (id) => document.getElementById(id);
const status = (msg) => { $('status').textContent = msg; };

let tx = null;

// The Flipper does not advertise its serial service UUID, so filtering on
// services finds nothing. Filter by name instead, and keep a show-everything
// fallback for Flippers renamed to something other than "Flipper …".
// optionalServices is mandatory in both cases: without it, getPrimaryService
// throws a SecurityError even after a successful connect.
// Bluefy does not always throw a real Error, so err.name/err.message can both
// be undefined. Squeeze a useful string out of whatever actually arrives.
// Bluefy throws raw CoreBluetooth error codes as numbers rather than Errors,
// so err.name/err.message are both undefined. Translate the ones that actually
// come up; anything else still reports its number.
const CB_ERRORS = {
  0: 'unknown',
  1: 'invalid parameters',
  2: 'invalid handle — iOS is holding a stale connection; re-pair to clear it',
  3: 'not connected',
  5: 'operation cancelled',
  6: 'connection timeout — is the Flipper in range with Bluetooth on?',
  7: 'peripheral disconnected',
  10: 'connection failed',
  14: 'pairing information removed — forget the Flipper in iOS Settings and re-pair',
  15: 'encryption timed out — re-pair',
};

function describeError(err) {
  if (err === null || err === undefined) return 'unknown failure (nothing thrown)';
  if (typeof err === 'number') {
    return CB_ERRORS[err] ? `bluetooth error ${err}: ${CB_ERRORS[err]}` : `bluetooth error ${err}`;
  }
  if (typeof err === 'string') return err;
  const name = err.name || err.constructor?.name || '';
  const message = err.message || err.toString?.() || '';
  if (name || message) return [name, message].filter(Boolean).join(': ');
  try {
    return JSON.stringify(err);
  } catch {
    return String(err);
  }
}

// A stale iOS GATT handle fails the first connect but usually succeeds on a
// second attempt after an explicit disconnect. Do that automatically.
async function connectWithRetry(device) {
  try {
    return await device.gatt.connect();
  } catch (err) {
    status(`Retrying (${describeError(err)})…`);
    try {
      device.gatt.disconnect();
    } catch { /* already disconnected */ }
    await new Promise((r) => setTimeout(r, 1200));
    return await device.gatt.connect();
  }
}

let lastDevice = null;

async function connect(options) {
  // Report the step we are ABOUT to attempt, so a failure names the step.
  let step = 'starting';
  try {
    step = 'requesting device';
    status('Requesting device…');
    const device = await navigator.bluetooth.requestDevice({
      ...options,
      optionalServices: [SERVICE],
    });
    lastDevice = device;

    device.addEventListener('gattserverdisconnected', () => {
      tx = null;
      $('send').disabled = true;
      $('disconnect').hidden = true;
      status('Disconnected');
    });

    step = 'connecting to GATT server';
    status('Connecting to GATT…');
    const server = await connectWithRetry(device);

    step = 'finding serial service';
    status('Finding serial service…');
    const service = await server.getPrimaryService(SERVICE);

    step = 'getting TX characteristic';
    status('Getting TX…');
    tx = await service.getCharacteristic(TX_CHAR);

    step = 'getting RX characteristic';
    status('Getting RX…');
    const rx = await service.getCharacteristic(RX_CHAR);

    step = 'subscribing to notifications';
    status('Subscribing…');
    await rx.startNotifications();
    rx.addEventListener('characteristicvaluechanged', (e) => {
      const reply = new TextDecoder().decode(e.target.value).trim();
      if (reply) status(reply);
    });

    // Deliberately NOT sending start_rpc_session — we want the CLI shell.
    $('send').disabled = false;
    $('disconnect').hidden = false;
    status(`Connected to ${device.name || 'Flipper'}`);
  } catch (err) {
    tx = null;
    $('send').disabled = true;
    status(`Failed while ${step} — ${describeError(err)}`);
  }
}

// iOS caches GATT state; an explicit disconnect makes retrying reliable.
$('disconnect').onclick = () => {
  try {
    if (lastDevice?.gatt?.connected) lastDevice.gatt.disconnect();
  } catch { /* nothing useful to do */ }
  tx = null;
  $('send').disabled = true;
  $('disconnect').hidden = true;
  status('Disconnected — tap Connect to retry');
};

$('connect').onclick = () => connect({ filters: [{ namePrefix: 'Flipper' }] });
$('connect-any').onclick = () => connect({ acceptAllDevices: true });

$('send').onclick = async () => {
  if (!tx) return;
  const text = $('text').value;
  if (!text) { status('Nothing to send'); return; }

  try {
    $('send').disabled = true;
    status('Sending — press OK on the Flipper');
    const bytes = new TextEncoder().encode(buildCommand(text));
    for (const part of chunk(bytes, CHUNK)) {
      await tx.writeValue(part);
    }
    $('text').value = '';
  } catch (err) {
    status(`Send failed — ${describeError(err)}`);
  } finally {
    $('send').disabled = false;
  }
};

if (!navigator.bluetooth) {
  status('Web Bluetooth unavailable — use Bluefy on iOS or Chrome on Android');
  $('connect').disabled = true;
  $('connect-any').disabled = true;
}

// Surface anything that escapes the handlers above rather than failing silently.
window.addEventListener('unhandledrejection', (e) => {
  status(`Unhandled: ${describeError(e.reason)}`);
});
</script>
</body>
</html>
